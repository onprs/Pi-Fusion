name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Upgrade npm for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck and tests
        run: npm run check

      - name: Extract changelog notes
        id: changelog
        run: |
          node -e '
            const fs = require("node:fs");
            const tag = process.env.GITHUB_REF_NAME || "";
            const version = tag.replace(/^v/, "");
            const content = fs.readFileSync("CHANGELOG.md", "utf8");
            const lines = content.split(/\r?\n/);
            let capturing = false;
            const out = [];
            for (const line of lines) {
              if (/^##\s+/.test(line)) {
                if (capturing) break;
                if (line.includes(version)) capturing = true;
                continue;
              }
              if (capturing) out.push(line);
            }
            const notes = out.join("\n").trim() || `Release ${tag}`;
            fs.writeFileSync("release-notes.md", notes + "\n", "utf8");
          '

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file release-notes.md
          else
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file release-notes.md
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
